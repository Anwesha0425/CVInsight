version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "[%(asctime)s] [%(name)s] [%(levelname)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    format: '{"time": "%(asctime)s", "name": "%(name)s", "level": "%(levelname)s", "message": "%(message)s"}'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: cvinsight.log
    maxBytes: 10485760
    backupCount: 5

root:
  level: INFO
  handlers: [console, file]

loggers:
  CVInsight:
    level: DEBUG
    handlers: [console]
    propagate: false
  werkzeug:
    level: WARNING
